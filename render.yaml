# Render Free + Cloudflare Pages, with an external PostgreSQL database.
# For existing data, import a verified backup before switching. For an explicitly
# fresh start, use an empty app database. Deployments never reset user tables.
services:
  - type: web
    name: tinytints-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - database/**
        - assets-library/**
        - shared/**
        - scripts/**
        - package.json
        - package-lock.json
        - render.yaml
    buildCommand: npm ci --omit=dev --workspace=backend --include-workspace-root
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://tinytints.pages.dev
      - key: CORS_ORIGINS
        value: https://tinytints.pages.dev
      - key: DATABASE_URL
        sync: false
      - key: EXPOSE_DEV_OTP
        value: "false"
      - key: PAYMENT_MOCK
        value: "false"
